<!doctype html>
<html lang="zh-CN" class="dark font-sans" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="TofuTV，面向 AI 影视与短剧创作的工作台。" />
        <link rel="icon" href="/tofutv-mark.png" type="image/png" />
        <link rel="preload" href="/tofutv-startup.png" as="image" />
        <link rel="stylesheet" href="/src/styles/globals.css" />
        <title>TofuTV</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--background, #0f0f0f);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: #0c0b19 url('/tofutv-startup.png') center / contain no-repeat;
            }
        </style>
        <script>
            // Match the saved preference before the first paint; invalid storage stays dark.
            let theme = "dark";
            try {
                if (JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state?.theme === "light") theme = "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#0e101a" : "#f5f5f5");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
